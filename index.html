<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leads">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<title>Leads – Landing Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login">
  <h1>Leads</h1>
  <p>Digite a senha para abrir os dados.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Senha">
  <label class="chk"><input id="lembrar" type="checkbox" checked> Lembrar nesta sessão</label>
  <button id="entrar" class="primary">Entrar</button>
  <p id="erro" class="erro" hidden></p>
</div>
<div id="app" hidden></div>
<script src="app.js"></script>
</body>
</html>
